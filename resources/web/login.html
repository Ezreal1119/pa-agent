<!doctype html>
<html lang="en-US">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product Expert · Sign in</title>
  <link rel="stylesheet" href="/style.css"><script defer src="/login.js"></script>
</head>
<body class="login-page">
  <main class="login-card">
    <a class="brand" href="/login" aria-label="Product Expert"><span class="brand-mark">p<span>e</span></span><span>Product Expert<small>KNOWLEDGE WORKSPACE</small></span></a>
    <div class="login-heading"><span class="eyebrow">WELCOME BACK</span><h1>Sign in to your workspace</h1><p>Your product knowledge and business memory, connected.</p></div>
    <form id="login-form">
      <label for="login-account">Account</label><input id="login-account" name="username" autocomplete="username" maxlength="256" required placeholder="Enter your admin account">
      <label for="login-password">Password</label><input id="login-password" name="password" type="password" autocomplete="current-password" maxlength="4096" required placeholder="Enter your password">
      <p id="login-error" class="form-error" role="alert" hidden></p>
      <p id="login-status" class="login-status" role="status">Checking sign-in configuration…</p>
      <button id="login-submit" class="primary-button login-submit" type="submit" disabled>Sign in <span>↗</span></button>
    </form>
    <p class="login-foot">Admin workspace · Sign-in lasts 7 days</p>
  </main>
</body>
</html>
