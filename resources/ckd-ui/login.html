<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>管理员登录 · CKD SOP</title><link rel="stylesheet" href="style.css"><script src="login.js" defer></script></head>
<body><main class="admin-login"><form id="login-form" class="panel"><div class="eyebrow">CKD SOP</div><h1>管理员登录</h1><p class="muted">登录后管理 Library、任务与图片评分。</p><label class="field"><span>账号</span><input name="account" autocomplete="username" required autofocus></label><label class="field"><span>密码</span><input name="password" type="password" autocomplete="current-password" required></label><p id="login-error" class="notice" role="alert" hidden></p><button class="button primary" type="submit">登录</button></form></main></body>
</html>
