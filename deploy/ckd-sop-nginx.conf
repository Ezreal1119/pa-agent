# Included in nginx's http context via sites-enabled. IP + HTTP only.
limit_req_zone $binary_remote_addr zone=ckd_login:1m rate=10r/m;

server {
    listen 80;
    server_name 8.133.254.83;

    location = /api/client/login {
        client_max_body_size 64k;
        limit_req zone=ckd_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4317;
        proxy_set_header Host 127.0.0.1:4317;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location ^~ /api/client/ {
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:4317;
        proxy_set_header Host 127.0.0.1:4317;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
    location = /admin/api/auth/login {
        client_max_body_size 64k;
        limit_req zone=ckd_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4317;
        proxy_set_header Host 127.0.0.1:4317;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location ^~ /admin/ {
        client_max_body_size 12m;
        proxy_pass http://127.0.0.1:4317;
        proxy_set_header Host 127.0.0.1:4317;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 600s;
        proxy_buffering off;
    }
    location = /admin { return 302 /admin/; }
    # Preserve the original IP site's upstream for every other path.
    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
